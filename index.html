function goalMilestones(){

function alignedPlanStart(){const d=new Date(data.settings.planStartDate+'T12:00:00');const day=Number(data.settings.weekStartDay);d.setDate(d.getDate()-((d.getDay()-day+7)%7));return isoDate(d)}function weekStart(date){const d=new Date(date+'T12:00:00');const day=Number(data.settings.weekStartDay);d.setDate(d.getDate()-((d.getDay()-day+7)%7));return isoDate(d)}function weekNumber(start){const anchor=new Date(alignedPlanStart()+'T12:00:00');const current=new Date(start+'T12:00:00');return Math.round((current-anchor)/86400000/7)+1}function weekEnd(start){const d=new Date(start+'T12:00:00');d.setDate(d.getDate()+6);return isoDate(d)}function weeklyRows(){const weeks=new Map();for(const m of ordered(data.measurements)){const k=weekStart(m.date);if(!weeks.has(k))weeks.set(k,[]);weeks.get(k).push(m)}return [...weeks].sort((a,b)=>b[0].localeCompare(a[0])).map(([start,entries])=>({start,end:weekEnd(start),entries,latest:entries.at(-1)}))}function weeklyTable(){const weeks=weeklyRows();return `<section class="panel"><h3>Mediciones por semana</h3><p class="muted">Semanas según el día de inicio configurado. Si hay varias mediciones en una semana, se muestra la última y se indica cuántos registros hay. Las semanas sin mediciones aparecen vacías.</p><div class="scroll"><table><thead><tr><th>Semana</th><th>Fecha de medición</th>${Object.values(fields).map(x=>`<th>${x}</th>`).join('')}<th>Registros</th></tr></thead><tbody>${weeks.length?weeks.map(w=>`<tr><td><b>${w.start.slice(8)}/${w.start.slice(5,7)} – ${w.end.slice(8)}/${w.end.slice(5,7)}</b></td><td>${w.latest.date}</td>${Object.keys(fields).map(k=>`<td>${fmt(w.latest[k])}</td>`).join('')}<td>${w.entries.length}</td></tr>`).join(''):'<tr><td colspan="12">Todavía no hay mediciones.</td></tr>'}</tbody></table></div></section>`}function measurements(){const rows=ordered(data.measurements).filter(inWeek).reverse();return `<h2>Mediciones · ${weekLabel(selectedWeek)}</h2><section class="panel"><h3>Agregar medición</h3><form onsubmi function saveMealDay(e){e.preventDefault();const form=e.currentTarget;const types=['Desayuno','Almuerzo','Merienda','Cena','Extra'];const date=selectedMealDay;if(!checkWeekDate(date))return;

const diskFilename = 'descenso-datos.json';
const diskState = {file:null, revision:null, pending:null, writing:false, linking:false, message:''};

function diskPanel(){
 return `<section class="panel"><h3>Copia en tu Mac</h3>
 <p class="muted">Elegí la carpeta de Descenso. La app guarda todos tus registros y fotos en <b>${diskFilename}</b> cada vez que hacés un cambio.</p>
 <button type="button" onclick="chooseLocalFolder()">${diskState.file?'Cambiar carpeta local':'Elegir carpeta local'}</button>
 <p id="disk-status" role="status" aria-live="polite">${esc(diskState.message || 'Elegí una carpeta para activar el guardado automático.')}</p></section>`;
}

function diskStatus(message){
 diskState.message=message;
 const status=document.getElementById('disk-status');
 if(status) status.textContent=message;
}

function diskSnapshot(){return JSON.stringify(data,null,2)+'\n'}

function isSupabaseSeed(value){
 return value?.importSource==='supabase-meals-2026-10-31' && validBackup(value);
}

function mergeSupabaseMeals(incoming){
 const present=new Set(data.meals.map(meal=>JSON.stringify([meal.date,meal.type])));
 const missing=incoming.meals.filter(meal=>!present.has(JSON.stringify([meal.date,meal.type])));
 data={...data,meals:[...data.meals,...missing]};
 return missing.length;
}


function folderDatabase(){
 return new Promise((resolve,reject)=>{
  const request=indexedDB.open('descenso-local-folder',1);
  request.onupgradeneeded=()=>request.result.createObjectStore('settings');
  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error);
 });
}

async function folderPreference(folder){
 const db=await folderDatabase();
 try {
  return await new Promise((resolve,reject)=>{
   const tx=db.transaction('settings',folder?'readwrite':'readonly');
   const store=tx.objectStore('settings');
   const request=folder?store.put(folder,'folder'):store.get('folder');
   tx.oncomplete=()=>resolve(request.result);
   tx.onerror=()=>reject(tx.error);
   tx.onabort=()=>reject(tx.error);
  });
 } finally {db.close()}
}

async function restoreFolderLink(){
 if(typeof window.showDirectoryPicker!=='function'){
  diskStatus('Esta apertura de Chrome no permite vincular una carpeta. Podés descargar el respaldo JSON desde Configuración.');
  return;
 }
 try {
  const folder=await folderPreference();
  if(!folder || diskState.linking || diskState.file) return;
  if(await folder.queryPermission({mode:'readwrite'})!=='granted'){
   diskStatus('Elegí de nuevo la carpeta de Descenso para reactivar el guardado.');
   return;
  }
  const file=await folder.getFileHandle(diskFilename);
  const revision=await (await file.getFile()).text();
  if(diskState.linking || diskState.file) return;
  if(revision!==diskSnapshot()){
   diskStatus('El archivo local y el navegador tienen datos distintos. Elegí la carpeta para revisar qué copia cargar.');
   return;
  }
  diskState.file=file;
  diskState.revision=revision;
  diskStatus('Copia automática activa en '+diskFilename+'.');
 } catch {
  if(!diskState.linking && !diskState.file) diskStatus('Elegí la carpeta de Descenso para activar el guardado automático.');
 }
}

async function chooseLocalFolder(){
 if(diskState.linking || diskState.writing) return;
 if(typeof window.showDirectoryPicker!=='function'){
  diskStatus('Abrí el HTML descargado en Chrome. Mientras tanto podés usar Descargar respaldo JSON.');
  return;
 }
 diskState.linking=true;
 try {
  const folder=await window.showDirectoryPicker({id:'descenso',mode:'readwrite'});
  let file;
  let revision;
  try {
   file=await folder.getFileHandle(diskFilename);
   revision=await (await file.getFile()).text();
  } catch(error) {
   if(error.name!=='NotFoundError') throw error;
   file=await folder.getFileHandle(diskFilename,{create:true});
   revision=await (await file.getFile()).text();
  }
  if(revision && revision!==diskSnapshot()){
   const incoming=JSON.parse(revision);
   if(!validBackup(incoming)) throw Error('El JSON local no tiene un formato válido de Descenso.');
   if(isSupabaseSeed(incoming)){
    mergeSupabaseMeals(incoming);
   }else{
    if(!confirm('Ya hay un respaldo en esta carpeta. ¿Cargar sus datos? Se descargará una copia de los registros que están abiertos ahora.')) return;
    backupBeforeReplace();
    data=incoming;
    data.tracking=Array.isArray(data.tracking)?data.tracking:[];
    data.weeklyReports=Array.isArray(data.weeklyReports)?data.weeklyReports:[];
    data.weeklyPhotos=data.weeklyPhotos||{};
    data.settings={weekStartDay:6,startWeight:70,planStartDate:today(),mealOptions:{},...(data.settings||{})};
    selectedWeek=weekStart(today());
   }
   try {localStorage.setItem(KEY,JSON.stringify(data))}
   catch {diskStatus('El navegador quedó sin espacio. El archivo local conserva tus datos.')}
  }
  diskState.file=file;
  diskState.revision=revision;
  await writeDiskCopy();
  try {await folderPreference(folder)} catch { /* Chrome puede pedir que vuelvas a elegir la carpeta. */ }
  render();
 } catch(error) {
  if(error.name!=='AbortError') diskStatus('No se pudo vincular la carpeta: '+error.message);
 } finally {diskState.linking=false}
}

async function writeDiskCopy(){
 if(!diskState.file) return;
 diskState.pending=diskSnapshot();
 if(diskState.writing) return;
 diskState.writing=true;
 diskStatus('Guardando la copia en tu Mac…');
 try {
  while(diskState.pending!==null){
   const snapshot=diskState.pending;
   diskState.pending=null;
   if(snapshot===diskState.revision) continue;
   const current=await (await diskState.file.getFile()).text();
   if(current!==diskState.revision) throw Error('El archivo cambió fuera de Descenso.');
   const writer=await diskState.file.createWritable();
   try {await writer.write(snapshot);await writer.close()}
   catch(error){await writer.abort().catch(()=>{});throw error}
   diskState.revision=snapshot;
  }
  diskStatus('Copia guardada en '+diskFilename+'.');
 } catch(error) {
  diskState.file=null;
  diskState.pending=null;
  diskStatus('La copia en disco quedó pendiente. '+error.message+' Volvé a elegir la carpeta o descargá el respaldo JSON.');
 } finally {diskState.writing=false}
}

const githubRepo = 'rosariogebala-cyber/descenso';
const githubPath = '/contents/datos/descenso.json';
const githubState = {token:'', busy:false, message:''};
const githubRevisionKey = 'descenso-github-revision-v1';

function githubPanel(){

 return `<section class="panel"><h3>Base de datos en GitHub</h3>

  <p class="muted">El guardado en GitHub es manual e incluye las fotos hasta un total de 900 KiB por respaldo. Los cambios también se guardan en este navegador.</p>
  <p role="status" aria-live="polite">${esc(githubState.message)}</p></section>`;
}

async function githubRequest(path, token, options={}){
 const response = await fetch('https://api.github.com/repos/'+githubRepo+path, {
  method:options.body ? 'PUT' : 'GET',
  cache:'no-store',
  redirect:'error',
  credentials:'omit',
  signal:AbortSignal.timeout(20000),
  headers:{Accept:'application/vnd.github+json', Authorization:'Bearer '+token,
   ...(options.body ? {'Content-Type':'application/json'} : {})},
  ...(options.body ? {body:JSON.stringify(options.body)} : {})
 });
 if(response.status===404 && options.missing) return null;
 if(!response.ok){
  const messages = {401:'La clave de GitHub venció o no es válida.',403:'La clave no tiene permiso o GitHub limitó las solicitudes.',
   404:'GitHub no encuentra el repositorio. Revisá que la clave tenga acceso a Descenso.',
   409:'El JSON cambió en GitHub. Traé la última versión antes de guardar.',
   422:'GitHub rechazó la escritura. Verificá si el JSON cambió o si la rama tiene restricciones.'};
  throw Error(messages[response.status] || 'GitHub devolvió el error '+response.status+'.');
 }
 return response.json();
}

async function githubPrivateRepo(token){
 const repo = await githubRequest('',token);
 if(repo.private!==true || repo.visibility!=='private' || repo.full_name?.toLowerCase()!==githubRepo
    || repo.owner?.type!=='User' || !repo.default_branch){
  throw Error('El respaldo requiere el repositorio personal Descenso en modo privado.');
 }
 return repo;
}

async function githubRun(operation){
 if(githubState.busy) return;
 githubState.busy=true;
 githubState.message='Conectando con GitHub…';
 render();
 try {githubState.message=await operation()}
 catch(error){githubState.message=error.message}
 finally {githubState.busy=false;render()}
}

function githubConnect(event){
 event.preventDefault();
 const input=event.currentTarget.elements.namedItem('token');
 const token=input.value.trim();
 input.value='';
 if(!token) return;
 return githubRun(async()=>{
  await githubPrivateRepo(token);
  githubState.token=token;
  return 'Conectado. Elegí si querés traer el respaldo o guardar tus registros.';
 });
}

function githubDisconnect(){
 if(githubState.busy) return;
 githubState.token='';
 githubState.message='Desconectado. Tu copia del navegador sigue disponible.';
 render();
}

function githubRead(branch){
 return githubRequest(githubPath+'?ref='+encodeURIComponent(branch),githubState.token,{missing:true});
}

function githubFileSha(file){
 if(file===null) return null;
 if(file.type!=='file' || !/^[a-f0-9]{40}$/i.test(file.sha||'')) throw Error('El destino de GitHub no es un archivo JSON válido.');
 return file.sha;
}

function githubBase64(bytes){
 let binary='';
 for(let i=0;i<bytes.length;i+=8192) binary+=String.fromCharCode(...bytes.subarray(i,i+8192));
 return btoa(binary);
}

function githubLoad(){
 if(!githubState.token) return;
 return githubRun(async()=>{
  const repo=await githubPrivateRepo(githubState.token);
  const file=await githubRead(repo.default_branch);
  const sha=githubFileSha(file);
  if(!sha) return 'Todavía no hay un respaldo en GitHub. Podés guardar tus registros.';
  if(file.encoding!=='base64' || !file.content) throw Error('El respaldo supera el tamaño que admite esta versión.');
  const bytes=Uint8Array.from(atob(file.content.replace(/\s/g,'')), character=>character.charCodeAt(0));
  const incoming=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(bytes));
  if(incoming===null) return 'Todavía no hay registros en GitHub. Podés guardar tus registros.';
  if(!validBackup(incoming)) throw Error('El JSON de GitHub no tiene un formato de Descenso válido.');
  if(isSupabaseSeed(incoming)){
   const previous=data;
   const added=mergeSupabaseMeals(incoming);
   if(!persist()){data=previous;throw Error('No se pudo guardar el historial en este navegador.')}
   localStorage.setItem(githubRevisionKey,sha);
   return added ? 'Se incorporaron '+added+' comidas de Supabase. Conservaste tu historial actual.' : 'Ya tenés las comidas del respaldo de Supabase.';
  }
  if(!confirm('¿Traer el respaldo de GitHub? Se descargará una copia de tus datos actuales antes de reemplazarlos en este navegador.')) return 'Carga cancelada.';
  backupBeforeReplace();
  const previous=data;
  data=incoming;
  data.tracking=Array.isArray(data.tracking)?data.tracking:[];
  data.weeklyReports=Array.isArray(data.weeklyReports)?data.weeklyReports:[];
  data.settings={weekStartDay:6,startWeight:70,planStartDate:today(),...(data.settings||{})};
  if(!persist()){data=previous;throw Error('No se pudo guardar el respaldo en este navegador.')}
  selectedWeek=weekStart(today());
  localStorage.setItem(githubRevisionKey,sha);
  return 'Respaldo recuperado de GitHub.';
 });
}

function githubSave(){
 if(!githubState.token) return;
 return githubRun(async()=>{
  const bytes=new TextEncoder().encode(JSON.stringify(data,null,2)+'\n');
  if(bytes.length>900*1024) throw Error('El respaldo supera 900 KiB. Descargá un JSON local para conservar todas tus fotos.');
  const repo=await githubPrivateRepo(githubState.token);
  const branch=repo.default_branch;
  const file=await githubRead(branch);
  const sha=githubFileSha(file);
  const previous=localStorage.getItem(githubRevisionKey);
  const starter=file?.encoding==='base64' && file.content?.replace(/\s/g,'')==='bnVsbAo=';
  if((sha && sha!==previous && !(starter && !previous)) || (!sha && previous)) throw Error('El archivo de GitHub cambió o falta. Conservá una copia local y revisá el respaldo remoto antes de guardar.');
  if(!confirm('¿Guardar tus registros y fotos en el repositorio privado rosariogebala-cyber/descenso? GitHub conserva versiones anteriores del JSON.')) return 'Guardado cancelado.';
  const result=await githubRequest(githubPath,githubState.token,{body:{
   message:'Actualizar respaldo de Descenso',content:githubBase64(bytes),branch,...(sha?{sha}:{})
  }});
  const savedSha=result.content?.sha;
  if(!/^[a-f0-9]{40}$/i.test(savedSha||'')) throw Error('GitHub no devolvió la versión del archivo. Revisá el repositorio.');
  localStorage.setItem(githubRevisionKey,savedSha);
  return 'Registros guardados en GitHub.';
 });
}

restoreFolderLink();
